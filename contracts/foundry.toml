[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.23"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
gas_reports = ["SkillAuthorityEnforcer", "AuthorityRegistry"]
fs_permissions = [{ access = "read", path = "./fixtures" }]

# DTK predeploy several contracts on 10143 and 143 at identical addresses.
# Tests fork testnet so the caveat enforcers are real, not mocks.
[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
